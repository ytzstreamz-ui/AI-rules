<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="AI Writing Rules, rules for your AI agent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161a"/>
      <stop offset="1" stop-color="#1e2327"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#b6f26b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b6f26b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(70,84)">
    <rect width="132" height="34" rx="17" fill="#b6f26b" fill-opacity="0.12" stroke="#b6f26b" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4" fill="#b6f26b"/>
    <text x="34" y="22" class="mono" font-size="14" fill="#b6f26b">README.md</text>
  </g>

  <text x="70" y="206" class="sans" font-size="82" font-weight="800" fill="#f4f6f8" letter-spacing="-2">AI Writing</text>
  <text x="70" y="288" class="sans" font-size="82" font-weight="800" fill="#b6f26b" letter-spacing="-2">Rules</text>
  <rect x="318" y="238" width="6" height="50" rx="2" fill="#b6f26b" class="cursor"/>

  <text x="70" y="338" class="sans" font-size="26" fill="#c9d1d9">rules for your AI agent</text>
  <text x="70" y="372" class="sans" font-size="18" fill="#8b949e">Sound like you. Not like a chatbot.</text>

  <g transform="translate(700,64)">
    <rect width="430" height="292" rx="16" fill="#0d1115" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M0 16a16 16 0 0 1 16-16h398a16 16 0 0 1 16 16v28H0z" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="6" fill="#febc2e"/>
    <circle cx="70" cy="22" r="6" fill="#28c840"/>
    <text x="404" y="27" text-anchor="end" class="mono" font-size="13" fill="#6e7781">rules.md</text>

    <g class="mono" font-size="17" fill="#e6edf3">
      <g transform="translate(28,82)">
        <circle cx="10" cy="-5" r="10" fill="#b6f26b" fill-opacity="0.15"/>
        <path d="M5 -5l4 4 7-8" fill="none" stroke="#b6f26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">no em dashes</text>
        <rect x="246" y="-9" width="22" height="3" rx="1.5" fill="#ff5f57"/>
        <line x1="238" y1="-18" x2="278" y2="6" stroke="#ff5f57" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(28,128)">
        <circle cx="10" cy="-5" r="10" fill="#b6f26b" fill-opacity="0.15"/>
        <path d="M5 -5l4 4 7-8" fill="none" stroke="#b6f26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">no code comments</text>
      </g>
      <g transform="translate(28,174)">
        <circle cx="10" cy="-5" r="10" fill="#b6f26b" fill-opacity="0.15"/>
        <path d="M5 -5l4 4 7-8" fill="none" stroke="#b6f26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">no generic AI slop</text>
      </g>
      <g transform="translate(28,220)">
        <circle cx="10" cy="-5" r="10" fill="#b6f26b" fill-opacity="0.15"/>
        <path d="M5 -5l4 4 7-8" fill="none" stroke="#b6f26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">never make things up</text>
      </g>
      <g transform="translate(28,266)">
        <circle cx="10" cy="-5" r="10" fill="#b6f26b" fill-opacity="0.15"/>
        <path d="M5 -5l4 4 7-8" fill="none" stroke="#b6f26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">write like a real person</text>
      </g>
    </g>
  </g>

  <g transform="translate(1040,34)">
    <rect width="104" height="34" rx="17" fill="#b6f26b"/>
    <text x="52" y="22" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#12161a">20 rules</text>
  </g>
</svg>
