<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="AI Writing Rules, rules for your AI agent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M10 18H8v-2h2v2Zm-2-2H6v-2h2v2Zm4-2v2h-2v-2h2Zm-6 0H4v-2h2v2Zm8 0h-2v-2h2v2Zm2-2h-2v-2h2v2Zm2-2h-2V8h2v2Zm2-2h-2V6h2v2Z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M4 11h16v2H4z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M11 18H9v-4h2v4Zm-4-1H5v-2h2v2Zm12-2v2h-2v-2h2ZM5 15H3v-2h2v2Zm16 0h-2v-2h2v2Zm-8-1h-2v-4h2v4ZM3 13H1v-2h2v2Zm20 0h-2v-2h2v2ZM5 11H3V9h2v2Zm16 0h-2V9h2v2Zm-6-1h-2V6h2v4ZM7 9H5V7h2v2Zm12 0h-2V7h2v2Z"/></symbol>
    <symbol id="i-robot" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 14h16v2H4zM2 8h2v12H2zm18 0h2v12h-2z"/><path d="M11 4h2v4h-2zm-3 6h2v2H8zm6 0h4v2h-4zm-1-8h4v2h-4zM0 12h2v2H0zm22 0h2v2h-2zm-12 4h4v2h-4zm-2-2h2v2H8zm6 0h2v2h-2z"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M2 10h2v2H2zm0 4h2v-2H2zm20-4h-2v2h2zm0 4h-2v-2h2zM4 8h2v2H4zm0 8h2v-2H4zm16-8h-2v2h2zm0 8h-2v-2h2zM6 6h2v2H6zm0 12h2v-2H6zM18 6h-2v2h2zm0 12h-2v-2h2zM8 4h2v2H8zm0 16h2v-2H8zm8-16h-2v2h2zm0 16h-2v-2h2zM10 2h2v2h-2zm0 20h2v-2h-2zm4-20h-2v2h2zm0 20h-2v-2h2zm-3-5h2v-2h-2zm0-4h2V7h-2z"/></symbol>
    <symbol id="i-human" viewBox="0 0 24 24"><path d="M10 2h4v4h-4zM3 7h18v2H3zm6 2h2v7H9zm4 0h2v7h-2zm-4 7h2v6H9zm4 0h2v6h-2zm-2-2h2v2h-2z"/></symbol>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161a"/>
      <stop offset="1" stop-color="#1e2327"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#b6f26b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b6f26b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(70,84)">
    <rect width="132" height="34" fill="#b6f26b" fill-opacity="0.12" stroke="#b6f26b" stroke-opacity="0.4"/>
    <rect x="16" y="13" width="8" height="8" fill="#b6f26b"/>
    <text x="34" y="22" class="mono" font-size="14" fill="#b6f26b">README.md</text>
  </g>

  <text x="70" y="206" class="sans" font-size="82" font-weight="800" fill="#f4f6f8" letter-spacing="-2">AI Writing</text>
  <text x="70" y="288" class="sans" font-size="82" font-weight="800" fill="#b6f26b" letter-spacing="-2">Rules</text>
  <rect x="318" y="238" width="6" height="50" fill="#b6f26b" class="cursor"/>

  <text x="70" y="338" class="sans" font-size="26" fill="#c9d1d9">rules for your AI agent</text>
  <text x="70" y="372" class="sans" font-size="18" fill="#8b949e">Sound like you. Not like a chatbot.</text>

  <g transform="translate(700,64)">
    <rect width="430" height="292" fill="#0d1115" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M0 0h430v44H0z" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="20" y="16" width="12" height="12" fill="#ff5f57"/>
    <rect x="42" y="16" width="12" height="12" fill="#febc2e"/>
    <rect x="64" y="16" width="12" height="12" fill="#28c840"/>
    <text x="404" y="27" text-anchor="end" class="mono" font-size="13" fill="#6e7781">rules.md</text>

    <g class="mono" font-size="17" fill="#e6edf3" shape-rendering="crispEdges">
      <g transform="translate(28,82)">
        <use href="#i-minus" x="0" y="-19" width="24" height="24" fill="#b6f26b"/>
        <text x="40" y="0" shape-rendering="auto">no em dashes</text>
        <use href="#i-check" x="378" y="-19" width="24" height="24" fill="#6e7781"/>
      </g>
      <g transform="translate(28,128)">
        <use href="#i-code" x="0" y="-19" width="24" height="24" fill="#b6f26b"/>
        <text x="40" y="0" shape-rendering="auto">no code comments</text>
        <use href="#i-check" x="378" y="-19" width="24" height="24" fill="#6e7781"/>
      </g>
      <g transform="translate(28,174)">
        <use href="#i-robot" x="0" y="-19" width="24" height="24" fill="#b6f26b"/>
        <text x="40" y="0" shape-rendering="auto">no generic AI slop</text>
        <use href="#i-check" x="378" y="-19" width="24" height="24" fill="#6e7781"/>
      </g>
      <g transform="translate(28,220)">
        <use href="#i-warn" x="0" y="-19" width="24" height="24" fill="#b6f26b"/>
        <text x="40" y="0" shape-rendering="auto">never make things up</text>
        <use href="#i-check" x="378" y="-19" width="24" height="24" fill="#6e7781"/>
      </g>
      <g transform="translate(28,266)">
        <use href="#i-human" x="0" y="-19" width="24" height="24" fill="#b6f26b"/>
        <text x="40" y="0" shape-rendering="auto">write like a real person</text>
        <use href="#i-check" x="378" y="-19" width="24" height="24" fill="#6e7781"/>
      </g>
    </g>
  </g>

  <g transform="translate(1026,34)">
    <rect width="118" height="34" fill="#b6f26b"/>
    <use href="#i-check" x="12" y="5" width="24" height="24" fill="#12161a" shape-rendering="crispEdges"/>
    <text x="44" y="22" class="sans" font-size="15" font-weight="700" fill="#12161a">21 rules</text>
  </g>
</svg>
